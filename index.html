<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bomb Party Solver</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            background-color: #f4f4f4;
            color: #333;
        }
        h1 { color: #555; }
        #input-container {
            margin-bottom: 20px;
        }
        input[type="text"] { 
            padding: 10px; 
            font-size: 16px; 
            width: 300px; 
            border: 1px solid #ccc; 
            border-radius: 4px;
            box-sizing: border-box;
        }
        #results {
            margin-top: 20px;
        }
        .loading { 
            color: #888; 
        }
        .no-results { 
            color: #888; 
        }
        .word-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .word-item {
            background-color: #fff;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>Bomb Party Solver</h1>
    <div id="input-container">
        <label for="chars"><strong>Enter Characters:</strong></label><br><br>
        <input type="text" id="chars" name="chars" placeholder="" autocomplete="off" required>
    </div>
    <div id="results">
        <!-- Results will be displayed here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('chars');
            const resultsDiv = document.getElementById('results');
            let dictionary = [];

            // Auto-focus the input field
            input.focus();

            // Display loading message
            resultsDiv.innerHTML = '<p class="loading">Loading dictionary...</p>';

            // Fetch the dictionary file
            fetch('dict.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.text();
                })
                .then(data => {
                    dictionary = data.split('\n').map(word => word.trim().toLowerCase()).filter(word => word.length > 0);
                    resultsDiv.innerHTML = ''; // Clear loading message
                })
                .catch(error => {
                    console.error('Error fetching dictionary:', error);
                    resultsDiv.innerHTML = '<p class="no-results">Failed to load dictionary.</p>';
                });

            // Function to filter and sort words based on substring matching
            const findMatchingWords = (inputChars) => {
                if (inputChars.length === 0) return [];
                return dictionary.filter(word => word.includes(inputChars))
                                 .sort((a, b) => a.length - b.length);
            };

            // Function to render results
            const renderResults = (words) => {
                if (words.length > 0) {
                    const header = document.createElement('h2');
                    header.textContent = `Matching Words (${words.length})`;
                    const wordList = document.createElement('div');
                    wordList.className = 'word-list';
                    
                    words.forEach(word => {
                        const wordItem = document.createElement('div');
                        wordItem.className = 'word-item';
                        wordItem.textContent = word;
                        wordList.appendChild(wordItem);
                    });
                    
                    resultsDiv.innerHTML = ''; // Clear previous results
                    resultsDiv.appendChild(header);
                    resultsDiv.appendChild(wordList);
                } else {
                    resultsDiv.innerHTML = '<p class="no-results">No matching words found.</p>';
                }
            };

            // Debounce function to limit the rate of function calls
            const debounce = (func, delay) => {
                let debounceTimer;
                return function() {
                    const context = this;
                    const args = arguments;
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => func.apply(context, args), delay);
                };
            };

            // Event listener for input changes
            input.addEventListener('input', debounce(() => {
                const query = input.value.trim().toLowerCase();
                if (query === '') {
                    resultsDiv.innerHTML = ''; // Clear results if input is empty
                    return;
                }
                const matches = findMatchingWords(query);
                renderResults(matches);
            }, 300)); // Adjust the delay as needed (300ms)

            // Event listener for keydown to handle ESC key
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    if (document.activeElement === input) {
                        // If focus is on the input, clear it
                        input.value = '';
                        resultsDiv.innerHTML = '';
                    } else {
                        // If focus is not on the input, focus it
                        input.focus();
                    }
                }
            });
        });
    </script>
</body>
</html>
